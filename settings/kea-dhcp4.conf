// Configuração do Kea DHCP para as quatro VLANs do projeto.
// __IFACE__ é trocado pelo nome real da interface pelo scripts/server.sh.
{
  "Dhcp4": {
    "interfaces-config": { "interfaces": [ "__IFACE__" ] },
    "lease-database": { "type": "memfile", "persist": true, "lfc-interval": 3600 },
    "authoritative": true,
    "match-client-id": false,
    "valid-lifetime": 28800,
    "option-data": [
      { "name": "domain-name-servers", "data": "10.70.70.6" }
    ],
    "subnet4": [
      {
        // VLAN 10 - Estações. "interface" simula a VLAN ligada direto ao servidor,
        // já que o laboratório não tem switch Layer 3 fazendo relay.
        "id": 10,
        "subnet": "192.168.10.0/24",
        "interface": "__IFACE__",
        "pools": [ { "pool": "192.168.10.50 - 192.168.10.200" } ],
        "option-data": [ { "name": "routers", "data": "192.168.10.1" } ],
        "reservations": [
          // MAC fixado no vagrantfile para o client02
          { "hw-address": "08:00:27:a0:b0:12", "ip-address": "192.168.10.10", "hostname": "client02" }
        ]
      },
      {
        // VLAN 20 - Câmeras / IoT (atendida via relay)
        "id": 20,
        "subnet": "192.168.20.0/24",
        "pools": [ { "pool": "192.168.20.50 - 192.168.20.200" } ],
        "option-data": [ { "name": "routers", "data": "192.168.20.1" } ],
        "reservations": [
          // DVR: MAC de exemplo
          { "hw-address": "aa:bb:cc:dd:ee:01", "ip-address": "192.168.20.10", "hostname": "dvr" }
        ]
      },
      {
        // VLAN 30 - Wi-Fi corporativo (atendida via relay)
        "id": 30,
        "subnet": "192.168.30.0/24",
        "pools": [ { "pool": "192.168.30.50 - 192.168.30.200" } ],
        "option-data": [ { "name": "routers", "data": "192.168.30.1" } ]
      },
      {
        // VLAN 40 - Visitantes (atendida via relay): lease curto e DNS público
        "id": 40,
        "subnet": "192.168.40.0/24",
        "valid-lifetime": 3600,
        "pools": [ { "pool": "192.168.40.50 - 192.168.40.200" } ],
        "option-data": [
          { "name": "routers", "data": "192.168.40.1" },
          { "name": "domain-name-servers", "data": "1.1.1.1, 8.8.8.8" }
        ]
      }
    ]
  }
}